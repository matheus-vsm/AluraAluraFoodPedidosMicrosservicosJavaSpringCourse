# Usa as mesmas variáveis da aplicação:
#   DB_USER_MYSQL  = root (usuário)
#   DB_PASSWORD_MYSQL = senha do root
# O container usa DB_PASSWORD_MYSQL como MYSQL_ROOT_PASSWORD; a aplicação usa as duas variáveis.
services:
  mysql:
    image: mysql:8.0
    container_name: pedidos-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_MYSQL}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alurafood_pedidos}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD_MYSQL}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
